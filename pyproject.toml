[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smc-pipeline"
version = "0.1.0"
description = "Bright-field nuclear segmentation and tracking for smooth muscle cell time-lapse imaging"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy", "opencv-python-headless", "scipy"]

[project.optional-dependencies]
segment = ["torch"]
dev = ["pytest"]

[project.scripts]
smc-pipeline = "smc_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
